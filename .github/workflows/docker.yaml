name: Publish Nmap images

on:
  workflow_dispatch:
  release:
    types: [published]
  # Called by database.yaml: in that case it only publishes the :db, :nodb, :v4-db,
  # :v4-nodb and branch tags.
  workflow_call:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: scripts/bump-version.sh --check "$RELEASE_TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (with database)
        id: meta-db
        uses: docker/metadata-action@v6
        with:
          images: scmanjarrez/cvescanner
          flavor: latest=false
          # Moving tag of the current major version; change it when the
          # major version changes.
          tags: |
            type=raw,value=db
            type=raw,value=v4-db
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Docker metadata (without database)
        id: meta-nodb
        uses: docker/metadata-action@v6
        with:
          images: scmanjarrez/cvescanner
          flavor: latest=false
          tags: |
            type=raw,value=nodb
            type=raw,value=v4-nodb
            type=semver,pattern={{version}},suffix=-nodb
            type=semver,pattern={{major}}.{{minor}},suffix=-nodb
            type=ref,event=branch,suffix=-nodb

      - name: Build and push image without database
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: nodb
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-nodb.outputs.tags }}
          labels: ${{ steps.meta-nodb.outputs.labels }}
          cache-from: type=gha,scope=nodb
          cache-to: type=gha,mode=max,scope=nodb

      - name: Build and push image with database
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: db
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            DATABASE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db
