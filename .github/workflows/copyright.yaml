name: Update copyright year

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 1 *" # 03:00 AM on January 1

jobs:
  update-years:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Change global git configurations
        run: |
          git config --global push.default current
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      - name: Update CVEScannerV2 year
        run: |
          year=$(date +"%Y")
          export year
          # shellcheck disable=SC2016 # perl regex must stay single-quoted ($+{from}, $ENV)
          {
            printf '%s\n' README.md nmap/src/cvescannerv2.nse dbrepo/build.sh dbrepo/README.md
            find nmap/src -name '*.lua'
            find db-manager/src scripts -name '*.py'
          } | xargs -d '\n' perl -i -pe 's/(?<=\([cC]\)\s)(?<from>\d+)(-\d+)?/$+{from}-$ENV{"year"}/'
          git add -u
          git commit -m "Copyright year update"
          git push
