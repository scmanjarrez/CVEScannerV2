name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f nmap/tests/Dockerfile -t cvescannerv2-tests .

      - name: Run NSE test suite
        run: docker run --rm cvescannerv2-tests

  db-manager-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db-manager
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run --with ruff ruff check src tests

      - name: Basedpyright
        run: uv run --with basedpyright basedpyright src

      - name: Unit tests
        run: uv run python -m unittest discover -s tests
