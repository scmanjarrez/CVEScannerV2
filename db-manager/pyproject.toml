[project]
name = "db-manager"
version = "4.0.2"
description = "Asynchronous CVE database updater and query tools"
readme = "README.md"
authors = [{ name = "Sergio Chica", email = "sergio.chica@csic.es" }]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "fake-useragent>=2.2.0",
  "httpx2>=2.13.1",
  "pydantic>=2.0",
  "rich>=13.9.4",
  "rich-argparse>=1.7.1",
  "sqlalchemy[asyncio]>=2.1.4",
  "textual>=1.0.0",
]

[project.scripts]
db-manager = "db_manager.cli.database:main"
db-query = "db_manager.cli.query:main"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 79
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [ # recommended to disable with ruff formatter
  "W191",   # tab-indentation
  "E111",   # indentation-with-invalid-multiple
  "E114",   # indentation-with-invalid-multiple-comment
  "E117",   # over-indented
  "D206",   # docstring-tab-indentation
  "D300",   # triple-single-quotes
  "Q000",   # bad-quotes-inline-string
  "Q001",   # bad-quotes-multiline-string
  "Q002",   # bad-quotes-docstring
  "Q003",   # avoidable-escaped-quote
  "Q004",   # unnecessary-escaped-quote
  "COM812", # missing-trailing-comma
  "COM819", # prohibited-trailing-comma
  "CPY001", # missing-copyright-notice
  "ISC002", # multi-line-implicit-string-concatenation if used without ISC001 and flake8-implicit-str-concat.allow-multiline = false
]

[tool.ruff.lint.pycodestyle]
max-line-length = 79

[tool.ruff.lint.per-file-ignores]
# Regression checks use the standard library unittest runner.
"tests/*.py" = ["PT009", "PT027"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
